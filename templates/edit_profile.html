<!DOCTYPE html>
<html>
<head>
<title>Edit Profile | BloomVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
    font-family:'Segoe UI', sans-serif;
}

.edit-card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.1);
    max-width:500px;
    margin:100px auto;
}

.edit-card h3{
    font-weight:700;
    margin-bottom:25px;
}

.form-control{
    border-radius:12px;
    padding:10px;
}

.btn-save{
    border-radius:30px;
    padding:10px 25px;
}
</style>
</head>

<body>

<div class="edit-card">

    <h3>Edit Profile</h3>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" 
                   class="form-control"
                   value="{{ user[0] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" 
                   class="form-control"
                   value="{{ user[1] }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" 
                   class="form-control"
                   value="{{ user[2] }}" required>
        </div>

        <button class="btn btn-dark btn-save">
            Save Changes
        </button>

        <a href="{{ url_for('profile') }}" 
           class="btn btn-outline-dark btn-save ms-2">
           Cancel
        </a>

    </form>

</div>

</body>
</html>
