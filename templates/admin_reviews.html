<!DOCTYPE html>
<html>
<head>
<title>Admin Reviews</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2>All Reviews</h2>

<table class="table table-bordered mt-3">
<tr>
<th>User Email</th>
<th>Book Title</th>
<th>Rating</th>
</tr>

{% for r in reviews %}
<tr>
<td>{{ r[0] }}</td>
<td>{{ r[1] }}</td>
<td>{{ r[2] }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
