<!DOCTYPE html>
<html>
<head>
<title>Edit Preferences | BloomVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== BACKGROUND ===== */
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

/* ===== MAIN CARD ===== */
.pref-card{
    width:95%;
    max-width:900px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    padding:50px;
    border-radius:25px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
}

/* ===== TITLE ===== */
.pref-title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin-bottom:40px;
}

/* ===== SEARCH BAR ===== */
.search-box{
    margin-bottom:20px;
}

/* ===== GRID ===== */
.option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
    max-height:250px;
    overflow-y:auto;
    padding-right:5px;
}

/* ===== CUSTOM PILL ===== */
.option-item{
    position:relative;
}

.option-item input{
    display:none;
}

.option-item label{
    display:block;
    padding:10px 15px;
    border-radius:50px;
    background:rgba(255,255,255,0.1);
    cursor:pointer;
    transition:0.3s;
    text-align:center;
    font-size:14px;
}

.option-item label:hover{
    background:rgba(255,255,255,0.2);
}

/* selected style */
.option-item input:checked + label{
    background:linear-gradient(135deg,#7b5cff,#a855f7);
    color:white;
    font-weight:600;
    box-shadow:0 5px 15px rgba(123,92,255,0.4);
}

/* ===== SAVE BUTTON ===== */
.btn-save{
    margin-top:35px;
    border-radius:50px;
    padding:12px;
    font-weight:600;
    background:linear-gradient(135deg,#facc15,#f59e0b);
    border:none;
    width:100%;
    color:black;
}

.btn-save:hover{
    opacity:0.9;
}

.section-title{
    margin:30px 0 15px 0;
    font-weight:600;
}
.back-btn{
display:inline-block;
margin-bottom:20px;

color:white;
text-decoration:none;

border:1px solid rgba(255,255,255,0.3);
padding:6px 16px;
border-radius:20px;

font-size:14px;
transition:0.3s;
}

.back-btn:hover{
background:white;
color:#111;
}

</style>
</head>

<body>


<div class="pref-card">

    <a href="{{ url_for('explore') }}" class="back-btn">
← Back
</a>
    
    <div class="pref-title">📚 Personalize Your Reading</div>

    <form method="POST">

        <!-- AUTHORS -->
        <div class="section-title">Favorite Authors</div>

        <input type="text" class="form-control search-box"
            placeholder="Search authors..."
            onkeyup="filterAuthors(this.value)">

        <div class="option-grid" id="authorList">
            {% for author in authors %}
            <div class="option-item">
                <input type="checkbox"
        name="author"
        value="{{ author }}"
        id="author{{ loop.index }}"
        {% if author in selected_authors %}checked{% endif %}>
<label for="author{{ loop.index }}">{{ author }}</label>
            </div>
            {% endfor %}
        </div>

        <!-- GENRES -->
        <div class="section-title">Favorite Genres</div>

        <div class="option-grid">
            {% for genre in genres %}
            <div class="option-item">
                <input type="checkbox"
        name="genre"
        value="{{ genre }}"
        id="genre{{ loop.index }}"
        {% if genre in selected_genres %}checked{% endif %}>
<label for="genre{{ loop.index }}">{{ genre }}</label>
            </div>
            {% endfor %}
        </div>


        <h4 class="mt-4">Preferred Languages</h4>

<div class="options-grid">

{% for lang in languages %}

<label class="option-card">
<input type="checkbox"
name="language"
value="{{ lang }}"
{% if lang in selected_languages %}checked{% endif %}>

<span>{{ lang }}</span>

</label>

{% endfor %}

</div>

        <button class="btn-save">
            Save Preferences 🚀
        </button>

    </form>

</div>

<script>
function filterAuthors(value){
    let items = document.querySelectorAll("#authorList .option-item");
    value = value.toLowerCase();
    items.forEach(item=>{
        let text = item.innerText.toLowerCase();
        item.style.display = text.includes(value) ? "block" : "none";
    });
}
</script>

</body>
</html>
