<!DOCTYPE html>
<html>
<head>
<title>Recommend Books</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">


<nav class="navbar navbar-dark bg-black px-4 d-flex justify-content-between">
    <a class="navbar-brand" href="{{ url_for('index') }}">BloomVerse</a>

    <div>
        <a href="{{ url_for('recommend_ui') }}" class="btn btn-warning me-2">Search Books</a>

        <span class="text-white me-3">Hello, {{ current_user }} 👋</span>

        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
</nav>


<div class="container mt-5">
    <a href="{{ url_for('explore') }}" class="btn btn-outline-warning mb-4">
    ← Back
</a>

<h2 class="text-center">Book Recommendation</h2>

<form action="{{ url_for('recommend_books') }}" method="POST" class="text-center mt-4">
    <input name="user_input" type="text" class="form-control w-50 mx-auto"
           placeholder="Enter a book name">
    <br>
    <button class="btn btn-warning">Recommend</button>
</form>

</div>

{% if data %}

<div class="container mt-5">
<div class="row">

{% for i in data %}
<div class="col-md-3">
<div class="card bg-secondary text-white">
    <img src="{{ i[2] }}" class="card-img-top" style="height:250px;">
    <div class="card-body">
        <h6>{{ i[0] }}</h6>
        <p>{{ i[1] }}</p>
    </div>
</div>
</div>
{% endfor %}

</div>
</div>

{% endif %}

</body>
</html>
