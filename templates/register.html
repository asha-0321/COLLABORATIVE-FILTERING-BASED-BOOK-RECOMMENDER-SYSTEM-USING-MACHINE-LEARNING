<!DOCTYPE html>
<html>
<head>
<title>Register - BloomVerse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
    position:relative;
    background:url('https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
    animation: zoomBg 25s ease-in-out infinite alternate;
}

/* Dark Overlay */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.65);
    z-index:0;
}

/* Smooth Background Zoom */
@keyframes zoomBg{
    from{ transform: scale(1); }
    to{ transform: scale(1.08); }
}

/* Register Card */
.register-card{
    position:relative;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    padding:45px;
    border-radius:25px;
    width:400px;
    color:white;
    box-shadow:0 20px 50px rgba(0,0,0,0.8);
    z-index:1;
    transition:0.4s;
}

.register-card:hover{
    transform: translateY(-5px);
}

/* Inputs */
.form-control{
    border-radius:50px;
    padding:12px 20px;
    border:none;
}

.form-control:focus{
    box-shadow:0 0 15px rgba(255,193,7,0.9);
}

/* Button */
.btn-custom{
    border-radius:50px;
    padding:10px;
    font-weight:600;
    transition:0.3s;
}

.btn-custom:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(255,193,7,0.7);
}

/* Login Link */
.login-link a{
    color:#ffc107;
    text-decoration:none;
    font-weight:600;
    transition:0.3s;
}

.login-link a:hover{
    opacity:0.8;
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="register-card text-center">

    <!-- Back Button -->
    <a href="{{ url_for('index') }}" class="btn btn-outline-warning mb-4">
        ← Back
    </a>

    <h3 class="text-warning mb-4">Join BloomVerse 📚</h3>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}">

    <input name="username"
           class="form-control mb-3"
           placeholder="Username"
           required>

    <input name="email"
           type="email"
           class="form-control mb-3"
           placeholder="Email Address"
           required>

    <!-- FIXED HERE (added mb-3) -->
    <input type="tel"
           name="phone"
           class="form-control mb-3"
           placeholder="Phone Number"
           required>

    <input name="password"
           type="password"
           class="form-control mb-3"
           placeholder="Password"
           required>

    <input name="confirm_password"
           type="password"
           class="form-control mb-4"
           placeholder="Confirm Password"
           required>

    <button class="btn btn-warning btn-custom w-100">
        Register
    </button>

</form>
    <!-- Already have account -->
    <div class="mt-4 login-link">
        <p>
            Already have an account?
            <a href="{{ url_for('user_login') }}">
                Login
            </a>
        </p>
    </div>

</div>

</body>
</html>
