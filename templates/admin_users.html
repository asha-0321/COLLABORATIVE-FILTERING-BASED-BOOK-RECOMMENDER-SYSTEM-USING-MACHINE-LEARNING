<!DOCTYPE html>
<html>
<head>
<title>Users</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2>All Users</h2>

<table class="table table-bordered mt-3">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Actions</th>
</tr>

{% for user in users %}
<tr>
<td>{{ user[0] }}</td>
<td>{{ user[1] }}</td>
<td>{{ user[2] }}</td>
<td>
<a href="/user_details/{{ user[2] }}" class="btn btn-sm btn-primary">View</a>

<a href="/delete_user/{{ user[2] }}" 
   class="btn btn-sm btn-danger"
   onclick="return confirm('Are you sure you want to delete this user?');">
   Delete
</a>
</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
