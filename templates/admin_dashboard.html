<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
}

/* Sidebar */
.sidebar{
    width:250px;
    height:100vh;
    background:#111;
    color:white;
    position:fixed;
    padding-top:20px;
}

.sidebar h4{
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    padding:12px 20px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.sidebar a:hover{
    background:#ffc107;
    color:black;
}

/* Main content */
.main{
    margin-left:250px;
    padding:30px;
}

/* Cards */
.card{
    border-radius:15px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h4>Admin Panel</h4>

    <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
    <a href="{{ url_for('admin_users') }}">Users</a>
    <a href="{{ url_for('admin_reviews') }}">Reviews</a>
    <a href="{{ url_for('admin_wishlist') }}">Wishlist</a>
    <a href="/logout" class="text-danger">Logout</a>
</div>

<!-- Main -->
<div class="main">

<h2>Dashboard</h2>

<div class="row mt-4">

<div class="col-md-4">
<div class="card p-3 shadow text-center">
<h5>Total Users</h5>
<h2>{{ total_users }}</h2>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 shadow text-center">
<h5>Total Reviews</h5>
<h2>{{ total_reviews }}</h2>
</div>
</div>

<div class="col-md-4">
<div class="card p-3 shadow text-center">
<h5>Wishlist Items</h5>
<h2>{{ total_wishlist }}</h2>
</div>
</div>

</div>

</div>

</body>
</html>
